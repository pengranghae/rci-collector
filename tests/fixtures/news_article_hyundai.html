<!doctype html><html><head><meta charset="utf-8"><title>현대자동차 하반기 신입 채용</title></head>
<body><nav>많이 본 뉴스 · 삼성 GSAT 10월 25일</nav>
<article class="article-body">
<p>현대자동차가 2026년 하반기 신입사원 채용을 진행한다고 24일 밝혔다.</p>
<p>지원서 접수는 9월 1일부터 9월 14일까지 채용 홈페이지에서 받는다.</p>
<p>인적성검사(HMAT)는 10월 17일 온라인으로 실시하며, 1차 면접은 11월 중 진행한다.</p>
<p>최종 합격자는 내년 1월 입사 예정이다. 회사 관계자는 "미래 모빌리티 분야 인재를 적극 선발할 계획"이라고 말했다. 채용 규모는 세 자릿수다.</p>
</article></body></html>
