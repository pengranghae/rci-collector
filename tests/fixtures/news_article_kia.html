<!doctype html><html><head><meta charset="utf-8"><title>기아 신입 채용</title></head>
<body><article>
<p>기아가 2026년 하반기 신입사원 공개채용을 실시한다고 2일 밝혔다.</p>
<p>지원서 접수는 9월 7일부터 9월 18일까지 진행한다. 인적성검사는 10월 24일 치른다.</p>
<p>기아는 이번 채용에서 연구개발, 생산, 품질 등 다양한 직무에서 인재를 선발한다. 자세한 내용은 채용 홈페이지에서 확인할 수 있다.</p>
</article></body></html>
