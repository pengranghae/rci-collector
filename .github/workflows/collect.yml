name: RCI Collector (채용 일정 자동 수집)

# 하루 4번 수집 → inbox.json 을 GitHub Pages 로 공개 → 캘린더 「수집함」이 그 주소를 읽어 감.
# 언론사 RSS 는 최근 기사 하루치 정도만 담고 있어서, 놓치지 않도록 6시간마다 돈다.
#   collect : 수집 후 배포 (예약 실행 · 수동 실행 기본값)
#   probe   : 출처 후보 점검만 (GitHub 서버에서 각 사이트에 접속되는지 확인, 결과는 Artifacts 의 probe_result.csv)
on:
  schedule:
    - cron: "40 20 * * *"   # KST 05:40
    - cron: "40 2 * * *"    # KST 11:40
    - cron: "40 8 * * *"    # KST 17:40
    - cron: "40 14 * * *"   # KST 23:40
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = 수집 후 배포 / probe = 출처 후보 접속 점검만"
        type: choice
        options: [collect, probe]
        default: collect

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rci
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self test (외부 접속 없음)
        run: python -m unittest discover -s tests

      # ── probe ──────────────────────────────────────────
      - name: Probe sources
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: python collect.py --probe

      - name: Upload probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe_result.csv
          retention-days: 14

      # ── collect ────────────────────────────────────────
      # 종료코드 0 = 성공, 1 = 일부 출처 실패(결과는 만들어짐), 2 = 치명적 오류
      - name: Collect
        id: collect
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.mode == 'probe') }}
        env:
          # 네이버 검색 API 키(선택). Settings → Secrets and variables → Actions 에 등록. 없으면 네이버 출처만 건너뜀.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set +e
          python collect.py
          RC=$?
          echo "collector exit code: $RC"
          if [ "$RC" -ge 2 ]; then exit "$RC"; fi
          if [ "$RC" -eq 1 ]; then echo "::warning::일부 출처 수집 실패 — 로그와 수집함의 '출처별 수집 상태'를 확인하세요."; fi
          exit 0

      - name: Build Pages
        if: steps.collect.outcome == 'success'
        run: |
          mkdir -p docs
          cp inbox.json docs/inbox.json
          GEN=$(python -c "import json;print(json.load(open('inbox.json',encoding='utf-8')).get('generatedAt',''))")
          N=$(python -c "import json;print(len(json.load(open('inbox.json',encoding='utf-8')).get('candidates',[])))")
          cat > docs/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>RCI inbox</title>
          <p>채용 캘린더 인사이트 — 자동 수집 결과</p>
          <p>생성: $GEN · 후보 $N건 · <a href="inbox.json">inbox.json</a></p>
          HTML

      - name: Commit state
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ inbox.json
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "chore: rci collect [$(TZ=Asia/Seoul date '+%F %H:%M')]"
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::상태 커밋 push 실패 — 배포는 계속합니다."

      - name: Upload Pages artifact
        if: steps.collect.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: run
    if: needs.run.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
